<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chipatala Connect — Patient</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --teal:#0F6E56; --teal-l:#E1F5EE;
    --blue:#185FA5; --blue-l:#E6F1FB;
    --purp:#534AB7; --purp-l:#EEEDFE;
    --amb:#BA7517;  --amb-l:#FAEEDA;
    --red:#A32D2D;  --red-l:#FCEBEB;
    --grn:#3B6D11;  --grn-l:#EAF3DE;
    --gray:#5F5E5A; --gray-l:#F1EFE8;
    --bg:#f5f4f0; --card:#fff;
    --text:#1a1a1a; --muted:#6b6b68;
    --radius:12px; --shadow:0 2px 12px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .screen{display:none;min-height:100vh;flex-direction:column}
  .screen.active{display:flex}

  /* ── Header ── */
  .header{background:var(--teal);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
  .header-logo{font-size:22px;font-weight:700;letter-spacing:-.5px}
  .header-sub{font-size:13px;opacity:.8}
  .back-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px;margin-right:4px}

  /* ── Login ── */
  .login-hero{background:linear-gradient(135deg,var(--teal),#0a4a3a);color:#fff;padding:48px 24px 36px;text-align:center}
  .login-hero h1{font-size:28px;font-weight:700;margin-bottom:8px}
  .login-hero p{font-size:15px;opacity:.85;line-height:1.5}
  .login-card{background:var(--card);margin:24px 20px;border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
  .login-card h2{font-size:18px;font-weight:600;margin-bottom:20px;color:var(--teal)}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--gray);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .field input{width:100%;padding:14px 16px;border:2px solid #e0e0d8;border-radius:8px;font-size:16px;outline:none;transition:border-color .2s}
  .field input:focus{border-color:var(--teal)}
  .btn{width:100%;padding:16px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-primary:hover{background:#0a5a48}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-secondary{background:var(--gray-l);color:var(--text);margin-top:10px}
  .error-msg{background:var(--red-l);color:var(--red);padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:16px;display:none}
  .demo-hint{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);background:var(--gray-l);padding:12px;border-radius:8px}
  .demo-hint strong{color:var(--teal)}

  /* ── Summary ── */
  .summary-header{background:var(--teal);color:#fff;padding:24px 20px}
  .patient-name{font-size:24px;font-weight:700}
  .patient-meta{font-size:14px;opacity:.85;margin-top:4px}
  .badge-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;background:rgba(255,255,255,.2);color:#fff}
  .badge.danger{background:#fff;color:var(--red)}
  .section{margin:16px 20px}
  .section-title{font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0ea}
  .info-row:last-child{border-bottom:none}
  .info-label{font-size:13px;color:var(--muted)}
  .info-value{font-size:14px;font-weight:600;text-align:right}
  .pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin:3px}
  .pill-red{background:var(--red-l);color:var(--red)}
  .pill-teal{background:var(--teal-l);color:var(--teal)}
  .pill-blue{background:var(--blue-l);color:var(--blue)}
  .pill-amb{background:var(--amb-l);color:var(--amb)}
  .encounter-item{padding:14px 0;border-bottom:1px solid #f0f0ea}
  .encounter-item:last-child{border-bottom:none}
  .enc-date{font-size:12px;color:var(--muted);margin-bottom:4px}
  .enc-facility{font-size:14px;font-weight:600;color:var(--teal)}
  .enc-reason{font-size:13px;color:var(--text);margin-top:2px}
  .enc-vitals{font-size:12px;color:var(--muted);margin-top:4px}
  .signed-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--grn);background:var(--grn-l);padding:3px 8px;border-radius:20px;margin-top:6px}

  /* ── QR Screen ── */
  .qr-screen{padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .qr-title{font-size:20px;font-weight:700;color:var(--teal);text-align:center}
  .qr-sub{font-size:14px;color:var(--muted);text-align:center;max-width:280px;line-height:1.5}
  #qrcode{padding:20px;background:#fff;border-radius:12px;box-shadow:var(--shadow)}
  .qr-instructions{background:var(--blue-l);border-radius:10px;padding:16px;font-size:13px;color:var(--blue);line-height:1.6;max-width:300px;width:100%}

  /* ── Consent ── */
  .consent-item{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .consent-facility{font-size:15px;font-weight:600;color:var(--text)}
  .consent-scope{font-size:13px;color:var(--muted);margin-top:4px}
  .consent-status{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:20px;margin-top:8px}
  .status-active{background:var(--grn-l);color:var(--grn)}
  .status-revoked{background:var(--red-l);color:var(--red)}
  .btn-revoke{border:none;background:var(--red-l);color:var(--red);padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
  .facility-list{display:flex;flex-direction:column;gap:10px}
  .fac-option{background:var(--card);border:2px solid #e0e0d8;border-radius:10px;padding:16px;cursor:pointer;transition:border-color .2s}
  .fac-option:hover,.fac-option.selected{border-color:var(--teal);background:var(--teal-l)}
  .fac-name{font-size:15px;font-weight:600}
  .fac-loc{font-size:13px;color:var(--muted)}

  /* ── Nav ── */
  .bottom-nav{background:#fff;border-top:1px solid #e8e8e0;display:flex;position:fixed;bottom:0;left:0;right:0}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;cursor:pointer;border:none;background:none;color:var(--muted);font-size:10px;gap:4px;transition:color .2s}
  .nav-item.active{color:var(--teal)}
  .nav-icon{font-size:22px}
  .main-content{flex:1;padding-bottom:70px;overflow-y:auto}

  /* ── Loading ── */
  .loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--muted)}
  .spinner{width:32px;height:32px;border:3px solid #e0e0d8;border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin-right:12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty-icon{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══════════════════════════════════════════════════════════ -->
<div id="screen-login" class="screen active">
  <div class="login-hero">
    <div style="font-size:40px;margin-bottom:12px">🏥</div>
    <h1>Chipatala Connect</h1>
    <p>Your health records, in your hands.<br>Secure · Private · Always with you.</p>
  </div>
  <div class="login-card">
    <h2>Sign in with your National ID</h2>
    <div id="login-error" class="error-msg"></div>
    <div class="field">
      <label>NRB Number</label>
      <input id="inp-nrb" type="text" placeholder="e.g. MW19600101000" autocomplete="off">
    </div>
    <div class="field">
      <label>PIN</label>
      <input id="inp-pin" type="password" placeholder="4-digit PIN" maxlength="6">
    </div>
    <button class="btn btn-primary" id="btn-login" onclick="doLogin()">Verify Identity</button>
    <div class="demo-hint">
      <strong>Demo:</strong> Use any NRB below with PIN <strong>1234</strong><br>
      <span id="demo-nrbs" style="font-size:12px;color:var(--teal)">Loading...</span>
    </div>
  </div>
</div>

<!-- ══ MAIN APP ══════════════════════════════════════════════════════════════ -->
<div id="screen-app" class="screen">
  <div class="main-content" id="main-content">
    <!-- dynamic content here -->
  </div>
  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-summary" onclick="showTab('summary')">
      <span class="nav-icon">👤</span>Summary
    </button>
    <button class="nav-item" id="nav-qr" onclick="showTab('qr')">
      <span class="nav-icon">📱</span>Share QR
    </button>
    <button class="nav-item" id="nav-records" onclick="showTab('records')">
      <span class="nav-icon">📋</span>Records
    </button>
    <button class="nav-item" id="nav-access" onclick="showTab('access')">
      <span class="nav-icon">🔐</span>Access
    </button>
    <button class="nav-item" id="nav-audit" onclick="showTab('audit')">
      <span class="nav-icon">📜</span>Audit
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://chipatala-connect-d3tx.onrender.com';  // same origin
let state = { token: null, patientId: null, summary: null, consents: [], audit: [], facilities: [] };

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const r = await fetch(API + '/fhir/Patient/search', {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-Api-Key':'key-unima-001'},
      body: JSON.stringify({})
    });
    const data = await r.json();
    const samples = data.results.slice(0,3).map(p=>p.nrb).join(' · ');
    document.getElementById('demo-nrbs').textContent = samples;
  } catch(e) {
    document.getElementById('demo-nrbs').textContent = 'MW19600101000 · MW19600238001';
  }
}
boot();

// ── Login ─────────────────────────────────────────────────────────────────────
async function doLogin() {
  const nrb = document.getElementById('inp-nrb').value.trim();
  const pin = document.getElementById('inp-pin').value.trim();
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  if (!nrb || !pin) { err.textContent='Please enter your NRB number and PIN'; err.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Verifying...';
  try {
    const r = await fetch(API + '/auth/identify', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ nrb_number: nrb, pin })
    });
    const data = await r.json();
    if (!r.ok) { err.textContent = data.message || 'Verification failed. Check your NRB number and PIN.'; err.style.display='block'; return; }
    state.token = data.session_token;
    state.patientId = data.patient_id;
    document.getElementById('screen-login').classList.remove('active');
    document.getElementById('screen-app').classList.add('active');
    await loadAll();
    showTab('summary');
  } catch(e) {
    err.textContent = 'Cannot connect to server. Is the gateway running?'; err.style.display='block';
  } finally {
    btn.disabled = false; btn.textContent = 'Verify Identity';
  }
}
document.getElementById('inp-pin').addEventListener('keypress', e => { if(e.key==='Enter') doLogin(); });

// ── Load all data ─────────────────────────────────────────────────────────────
async function loadAll() {
  const [sumR, conR, audR, facR] = await Promise.all([
    fetch(API+'/fhir/Patient/'+state.patientId+'/$summary', {headers:{Authorization:'Bearer '+state.token}}),
    fetch(API+'/consents/'+state.patientId, {headers:{Authorization:'Bearer '+state.token}}),
    fetch(API+'/audit/'+state.patientId, {headers:{Authorization:'Bearer '+state.token}}),
    fetch(API+'/facilities'),
  ]);
  state.summary = await sumR.json();
  state.consents = (await conR.json()).consents || [];
  state.audit = (await audR.json()).entries || [];
  state.facilities = await facR.json();
}

// ── Tab navigation ────────────────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-'+tab)?.classList.add('active');
  const mc = document.getElementById('main-content');
  const tabs = { summary: renderSummary, qr: renderQR, records: renderRecords, access: renderAccess, audit: renderAudit };
  if (tabs[tab]) mc.innerHTML = tabs[tab]();
  if (tab === 'qr') generateQR();
  if (tab === 'access') renderAccessDynamic();
}

// ── Summary tab ───────────────────────────────────────────────────────────────
function renderSummary() {
  const s = state.summary;
  if (!s) return '<div class="loading"><div class="spinner"></div>Loading...</div>';
  const p = s.patient;
  const allergyDanger = s.allergy && s.allergy !== 'None';
  return `
    <div class="summary-header">
      <div style="font-size:13px;opacity:.7;margin-bottom:4px">PATIENT SUMMARY</div>
      <div class="patient-name">${p.name}</div>
      <div class="patient-meta">NRB: ${p.nrb} · ${p.age}y · ${cap(p.gender)} · ${p.village}</div>
      <div class="badge-row">
        <div class="badge">🩸 ${s.patient.bloodType}</div>
        ${allergyDanger ? `<div class="badge danger">⚠️ Allergy: ${s.allergy}</div>` : '<div class="badge">No known allergies</div>'}
        <div class="badge">📍 ${s.primaryFacility}</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Identity</div>
      <div class="card">
        <div class="info-row"><span class="info-label">Full Name</span><span class="info-value">${p.name}</span></div>
        <div class="info-row"><span class="info-label">NRB Number</span><span class="info-value">${p.nrb}</span></div>
        <div class="info-row"><span class="info-label">Date of Birth</span><span class="info-value">${p.dob}</span></div>
        <div class="info-row"><span class="info-label">Gender</span><span class="info-value">${cap(p.gender)}</span></div>
        <div class="info-row"><span class="info-label">Phone</span><span class="info-value">${p.phone}</span></div>
        <div class="info-row"><span class="info-label">Village</span><span class="info-value">${p.village}</span></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Active Conditions</div>
      <div class="card">
        ${s.conditions.length ? s.conditions.map(c=>`<span class="pill pill-blue">${c.display}</span>`).join('') : '<span style="color:var(--muted);font-size:14px">No chronic conditions recorded</span>'}
      </div>
    </div>

    <div class="section">
      <div class="section-title">Current Medications</div>
      <div class="card">
        ${s.medications.length ? s.medications.map(m=>`
          <div class="info-row">
            <span class="info-label">${m.display}</span>
            <span class="info-value" style="font-size:12px">${m.dose}</span>
          </div>`).join('') : '<span style="color:var(--muted);font-size:14px">No active medications</span>'}
      </div>
    </div>

    <div class="section">
      <div class="section-title">Allergy Status</div>
      <div class="card" style="${allergyDanger?'border-left:4px solid var(--red)':''}">
        <div style="font-size:${allergyDanger?'16px':'14px'};font-weight:${allergyDanger?'700':'400'};color:${allergyDanger?'var(--red)':'var(--muted)'}">
          ${allergyDanger ? '⚠️ '+s.allergy : '✓ No known drug allergies'}
        </div>
      </div>
    </div>
  `;
}

// ── Records tab ───────────────────────────────────────────────────────────────
function renderRecords() {
  const s = state.summary;
  return `
    <div style="padding:20px">
      <div style="font-size:18px;font-weight:700;margin-bottom:4px;color:var(--teal)">Visit History</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px">Records signed by facilities you visited</div>
      <div class="card" id="records-container">
        <div class="loading"><div class="spinner"></div>Loading records...</div>
      </div>
    </div>
  `;
  // Records loaded separately after render via timeout
}

// ── QR tab ────────────────────────────────────────────────────────────────────
function renderQR() {
  const s = state.summary;
  if (!s) return '';
  const p = s.patient;
  return `
    <div style="background:var(--teal);color:#fff;padding:20px;text-align:center">
      <div style="font-size:14px;opacity:.8;margin-bottom:4px">OFFLINE TRANSFER</div>
      <div style="font-size:20px;font-weight:700">Share with Facility</div>
      <div style="font-size:13px;opacity:.8;margin-top:4px">No internet needed · Zero data cost</div>
    </div>
    <div class="qr-screen">
      <div class="qr-title">Your Health Summary QR</div>
      <div class="qr-sub">Show this QR code to any Chipatala Connect facility. They can read your summary instantly, even offline.</div>
      <div id="qrcode"></div>
      <div style="text-align:center">
        <div style="font-size:15px;font-weight:700;color:var(--text)">${p.name}</div>
        <div style="font-size:13px;color:var(--muted)">${p.nrb} · Blood: ${p.bloodType}</div>
        ${s.allergy !== 'None' ? `<div style="color:var(--red);font-size:13px;font-weight:600;margin-top:4px">⚠️ Allergy: ${s.allergy}</div>` : ''}
      </div>
      <div class="qr-instructions">
        <strong>How it works:</strong><br>
        1. The facility scans this QR code<br>
        2. Your summary loads on their tablet<br>
        3. No internet connection needed<br>
        4. No data is sent to any server<br>
        5. You stay in control at all times
      </div>
    </div>
  `;
}

function generateQR() {
  const s = state.summary;
  if (!s || !window.QRCode) return;

  const p = s.patient;
  const list = (items) => items && items.length ? items.slice(0, 3).map(x => `- ${x.display || x.name || x}`).join('\n') : 'None';
  
  const conditions = list(s.conditions);
  const medications = list(s.medications);
  const allergies = s.allergy && s.allergy !== 'None' ? s.allergy : 'None';

  let text = `CHIPATALA CONNECT SUMMARY\n`;
  text += `NAME: ${p.name}\n`;
  text += `ID: ${p.nrb}\n`;
  text += `AGE/SEX: ${p.age}y / ${p.gender}\n`;
  text += `BLOOD: ${p.bloodType}\n`;
  text += `ALLERGY: ${allergies}\n`;
  text += `---\n`;
  text += `CONDITIONS:\n${conditions}\n`;
  text += `MEDS:\n${medications}\n`;
  text += `---\n`;
  text += `FULL RECORD:\n`;
  text += `${API}/fhir/Patient/${state.patientId}/$summary.csv`;

  setTimeout(() => {
    const el = document.getElementById('qrcode');
    if (!el) return;
    el.innerHTML = '';
    try {
      new QRCode(el, { 
        text: text, 
        width: 250, 
        height: 250, 
        colorDark: '#0F6E56', 
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M 
      });
    } catch (e) {
      el.innerHTML = '<div style="font-size:12px;color:red;padding:20px">Error: Summary too long for QR.</div>';
    }
  }, 100);
}

// ── Access tab ────────────────────────────────────────────────────────────────
function renderAccess() {
  return `
    <div style="padding:20px">
      <div style="font-size:18px;font-weight:700;margin-bottom:4px;color:var(--teal)">Manage Access</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px">Control which facilities can view your full records</div>
      <div id="access-content"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  `;
}

async function renderAccessDynamic() {
  await loadAll();
  const el = document.getElementById('access-content');
  if (!el) return;

  const active = state.consents.filter(c => !c.revokedAt);
  const revoked = state.consents.filter(c => c.revokedAt);

  let html = '';

  if (active.length) {
    html += `<div class="section-title" style="margin-bottom:10px">Active Consents</div>`;
    active.forEach(c => {
      const fac = state.facilities.find(f=>f.id===c.requestingFacilityId);
      html += `
        <div class="consent-item">
          <div class="consent-facility">🏥 ${c.facilityName || fac?.name || 'Unknown Facility'}</div>
          <div class="consent-scope">Scope: ${c.scope.join(', ')}</div>
          <div class="consent-scope">Purpose: ${c.purpose}</div>
          <div class="consent-scope">Granted: ${new Date(c.grantedAt).toLocaleDateString()}</div>
          <div class="consent-status status-active">✓ Active</div><br>
          <button class="btn-revoke" onclick="revokeConsent('${c.id}')">Revoke Access</button>
        </div>`;
    });
  }

  html += `
    <div class="section-title" style="margin:16px 0 10px">Grant Access to a Facility</div>
    <div class="facility-list">
  `;
  state.facilities.forEach(f => {
    const hasConsent = active.find(c=>c.requestingFacilityId===f.id);
    if (!hasConsent) {
      html += `
        <div class="fac-option" onclick="grantConsent('${f.id}')">
          <div class="fac-name">🏥 ${f.name}</div>
          <div class="fac-loc">📍 ${f.location}</div>
          <div style="font-size:12px;color:var(--teal);margin-top:6px">Tap to grant access →</div>
        </div>`;
    }
  });
  html += '</div>';

  if (revoked.length) {
    html += `<div class="section-title" style="margin:20px 0 10px">Revoked Consents</div>`;
    revoked.slice(0,3).forEach(c => {
      html += `
        <div class="consent-item" style="opacity:.6">
          <div class="consent-facility">${c.facilityName || 'Facility'}</div>
          <div class="consent-status status-revoked">✗ Revoked ${new Date(c.revokedAt).toLocaleDateString()}</div>
        </div>`;
    });
  }

  el.innerHTML = html;
}

async function grantConsent(facilityId) {
  try {
    const r = await fetch(API+'/consent', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},
      body: JSON.stringify({
        requesting_facility_id: facilityId,
        scope: ['encounters','conditions','medications','observations'],
        purpose: 'Clinical consultation'
      })
    });
    const d = await r.json();
    if(r.ok) { toast('✓ Access granted to '+d.facility); await renderAccessDynamic(); }
    else toast('Error: '+d.error);
  } catch(e) { toast('Connection error'); }
}

async function revokeConsent(consentId) {
  if (!confirm('Revoke this access? The facility will no longer be able to view your records.')) return;
  try {
    const r = await fetch(API+'/consent/'+consentId, {
      method:'DELETE', headers:{'Authorization':'Bearer '+state.token}
    });
    if(r.ok) { toast('Access revoked'); await renderAccessDynamic(); }
  } catch(e) { toast('Connection error'); }
}

// ── Audit tab ─────────────────────────────────────────────────────────────────
function renderAudit() {
  const entries = state.audit;
  const icons = {
    patient_identified:'🔑', summary_accessed:'👁️', record_accessed:'📂',
    record_access_denied:'🚫', consent_granted:'✅', consent_revoked:'❌',
    encounter_created:'📝', record_created:'🆕'
  };
  const colors = {
    record_access_denied:'var(--red)', consent_revoked:'var(--red)',
    consent_granted:'var(--grn)', record_accessed:'var(--blue)',
    encounter_created:'var(--teal)'
  };

  return `
    <div style="padding:20px">
      <div style="font-size:18px;font-weight:700;margin-bottom:4px;color:var(--teal)">Audit Trail</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px">Tamper-evident log of every access to your records</div>
      ${entries.length === 0 ? '<div class="empty-state"><div class="empty-icon">📜</div><div>No audit entries yet</div></div>' :
        `<div class="card">
          ${entries.map(e=>`
            <div class="encounter-item">
              <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                  <div style="font-size:14px;font-weight:600;color:${colors[e.action]||'var(--text)'}">
                    ${icons[e.action]||'📋'} ${e.action.replace(/_/g,' ')}
                  </div>
                  <div class="enc-date">${e.facilityName} · ${new Date(e.timestamp).toLocaleString()}</div>
                  ${e.resourceType?`<div style="font-size:12px;color:var(--muted)">Resource: ${e.resourceType}</div>`:''}
                </div>
              </div>
              <div style="font-size:10px;color:#ccc;margin-top:6px;word-break:break-all">
                Hash: ${e.rowHash?.slice(0,32)}...
              </div>
            </div>
          `).join('')}
        </div>`
      }
    </div>
  `;
}

// ── Load records async ────────────────────────────────────────────────────────
async function loadRecords() {
  const s = state.summary;
  if (!s) return;
  // Fetch full records from primary facility (patient token)
  const r = await fetch(API+'/fhir/Patient/'+state.patientId+'/$summary', {
    headers:{'Authorization':'Bearer '+state.token}
  });
  // For demo: just use encounters from summary-style endpoint
  const container = document.getElementById('records-container');
  if (!container) return;
  if (!s) { container.innerHTML='<div class="empty-state">No records found</div>'; return; }
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function cap(s) { return s ? s[0].toUpperCase()+s.slice(1) : ''; }
function toast(msg, dur=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}
