services:
  postgres:
    image: postgres:14-alpine
    container_name: unmaid-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yourpassword 
      - POSTGRES_DB=unmaid
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
